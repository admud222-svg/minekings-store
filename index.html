<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Texture Scanner</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e1e; 
            color: #ffffff; 
            padding: 20px; 
            line-height: 1.6;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #2d2d2d; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }
        h1 { 
            text-align: center; 
            color: #4CAF50; 
            border-bottom: 2px solid #444;
            padding-bottom: 15px;
        }
        p { text-align: center; color: #aaaaaa; }
        .upload-area {
            border: 2px dashed #4CAF50;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: #252525;
            margin-bottom: 20px;
        }
        input[type="file"] { 
            display: block; 
            width: 100%; 
            cursor: pointer;
            color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        .btn-copy { background: #2196F3; }
        .btn-copy:hover { background: #1976D2; }
        
        textarea { 
            width: 100%; 
            height: 400px; 
            background: #121212; 
            color: #00ff00; 
            border: 1px solid #444; 
            padding: 15px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px;
            border-radius: 6px; 
            resize: vertical; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Bedrock Texture Scanner</h1>
        <p>Pilih folder <b>Resource Pack</b> kamu. Sistem pintar ini akan mencari semua file <code>.json</code> (seperti <i>item_texture.json</i>) dan mengekstrak semua Texture Path secara otomatis.</p>
        
        <div class="upload-area">
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </div>

        <div class="btn-group">
            <button onclick="scanFiles()">🔍 Mulai Scan Folder</button>
            <button class="btn-copy" onclick="copyText()">📋 Copy Hasil ke AI</button>
        </div>
        
        <textarea id="output" readonly placeholder="List path texture akan muncul di sini secara otomatis..."></textarea>
    </div>

    <script>
        async function scanFiles() {
            const files = document.getElementById('folderInput').files;
            if (files.length === 0) return alert("⚠️ Tolong pilih folder Resource Pack terlebih dahulu!");

            const output = document.getElementById('output');
            output.value = "⏳ Sedang melakukan scanning pada " + files.length + " file... Mohon tunggu...\n";
            
            let textureSet = new Set();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Hanya scan file bereksistensi JSON untuk menghindari lag
                if (file.name.endsWith('.json')) {
                    try {
                        const text = await file.text();
                        // Regex Sakti: Mencari semua teks yang memiliki format path texture Bedrock
                        const matches = text.match(/textures\/(items|blocks)\/[a-zA-Z0-9_\-\/]+/g);
                        
                        if (matches) {
                            matches.forEach(match => textureSet.add(match));
                        }
                    } catch (e) {
                        console.error("Gagal membaca file: " + file.name);
                    }
                }
            }

            // Ubah hasil dari Set ke Array agar bisa diurutkan secara alfabet
            const sortedTextures = Array.from(textureSet).sort();
            let finalString = "";
            
            if (sortedTextures.length === 0) {
                finalString = "❌ Tidak ada texture path yang ditemukan! Pastikan kamu memilih folder Resource Pack yang benar.";
            } else {
                finalString = `✅ SCAN SUKSES! Total Ditemukan: ${sortedTextures.length} Texture Paths\n`;
                finalString += "=================================================\n\n";
                sortedTextures.forEach((path, index) => {
                    finalString += `${index + 1}. ${path}\n`;
                });
            }

            output.value = finalString;
        }

        function copyText() {
            const output = document.getElementById('output');
            if(output.value === "" || output.value.includes("Sedang melakukan")) {
                return alert("Belum ada hasil yang bisa di-copy!");
            }
            output.select();
            document.execCommand("copy");
            alert("✅ Hasil berhasil di-copy! Silakan paste ke obrolan AI kita.");
        }
    </script>
</body>
</html>
