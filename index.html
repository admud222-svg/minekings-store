<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Texture Scanner - All Textures</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2c2c2c;
            --accent: #10B981;
            --accent-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 20px; 
            line-height: 1.5;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        h1 { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p.subtitle { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        
        .upload-area {
            border: 2px dashed var(--accent);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.05);
            margin-bottom: 20px;
        }

        input[type="file"] { width: 100%; cursor: pointer; color: var(--text-main); }
        
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap; 
        }

        button { 
            flex: 1;
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 12px 15px; 
            font-size: 14px; 
            font-weight: 600;
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s;
            min-width: fit-content;
        }
        
        button:hover { background: var(--accent-hover); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background: var(--border); color: #888; cursor: not-allowed; transform: none; }
        
        .btn-purple { background: #8B5CF6; }
        .btn-purple:hover { background: #7C3AED; }
        
        #searchInput {
            width: 100%;
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border);
            background: var(--bg-main); 
            color: white; 
            font-size: 14px;
        }
        
        #statusText {
            text-align: center; 
            margin-bottom: 15px; 
            color: #FBBF24; 
            font-weight: 600;
            font-size: 0.9rem;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            background: var(--bg-hover); 
            padding: 12px; 
            border-radius: 8px;
            border: 1px solid var(--border);
            gap: 15px;
        }

        .item-info {
            display: flex; 
            align-items: center; 
            gap: 15px; 
            flex: 1; 
            min-width: 0; 
        }

        .item-img {
            width: 45px; height: 45px; 
            object-fit: contain; 
            background: #000; 
            border-radius: 6px; 
            padding: 3px;
            flex-shrink: 0;
            image-rendering: pixelated; 
        }

        .item-path {
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            color: #60A5FA;
            word-break: break-all; 
        }
        
        .btn-copy-small { 
            background: #374151; 
            flex: none; 
            padding: 8px 12px; 
            font-size: 12px; 
        }
        .btn-copy-small:hover { background: #4B5563; }
        
        .pagination {
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 15px; 
            margin-top: 25px;
        }
        .page-info { font-weight: bold; color: var(--accent); font-size: 14px; }

        @media (max-width: 600px) {
            .list-item { flex-direction: column; align-items: flex-start; }
            .item-info { width: 100%; }
            .btn-copy-small { width: 100%; margin-top: 5px; } 
            .controls-grid { gap: 10px; }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Visual Texture Scanner (All Files)</h1>
        <p class="subtitle">Mendeteksi <b>SEMUA</b> gambar di folder textures/ (termasuk 3D, entity, UI, dll).</p>
        
        <div class="upload-area">
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </div>

        <div class="controls-grid">
            <div class="btn-group">
                <button id="scanBtn" onclick="scanFiles()">🔍 Mulai Scan Instan</button>
                <button id="dlBtn" class="btn-purple" onclick="downloadTXT()" disabled>💾 Download .TXT</button>
            </div>
            <input type="text" id="searchInput" placeholder="Cari path tekstur..." onkeyup="filterList()" disabled>
        </div>
        
        <div id="statusText"></div>

        <div class="list-container" id="listContainer">
            </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="btnPrev" onclick="changePage(-1)">◀ Prev</button>
            <span class="page-info" id="pageInfo">Hal 1 / 1</span>
            <button id="btnNext" onclick="changePage(1)">Next ▶</button>
        </div>
    </div>

    <script>
        let allItems = [];
        let filteredItems = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 15;

        async function scanFiles() {
            const files = document.getElementById('folderInput').files;
            if (files.length === 0) return alert("Pilih folder Resource Pack dulu!");

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('dlBtn').disabled = true;
            document.getElementById('statusText').innerText = "⏳ Sedang menyisir file gambar...";
            document.getElementById('listContainer').innerHTML = "";
            document.getElementById('pagination').style.display = "none";
            
            allItems = [];

            // LUPAKAN JSON! Kita scan langsung file PNG/TGA nya!
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath.toLowerCase().replace(/\\/g, '/');

                // Jika filenya berupa gambar dan ada di dalam folder 'textures'
                if (path.includes('textures/') && (path.endsWith('.png') || path.endsWith('.tga'))) {
                    // Ambil teks mulai dari 'textures/...' sampai sebelum '.png'
                    const match = path.match(/(textures\/.*)\.(png|tga)$/);
                    if (match) {
                        allItems.push({
                            path: match[1], // Simpan path bersih tanpa extensi
                            imageFile: file
                        });
                    }
                }
            }

            // Urutkan berdasarkan Abjad (A-Z)
            allItems.sort((a, b) => a.path.localeCompare(b.path));
            filteredItems = [...allItems];
            
            if (allItems.length > 0) {
                document.getElementById('statusText').innerText = `✅ Sukses! Ditemukan ${allItems.length} texture path (3D, Item, Block, Entity, dll).`;
                document.getElementById('searchInput').disabled = false;
                document.getElementById('dlBtn').disabled = false; 
                currentPage = 1;
                renderList();
            } else {
                document.getElementById('statusText').innerText = "❌ Tidak ada gambar yang ditemukan di folder 'textures'.";
            }
            
            document.getElementById('scanBtn').disabled = false;
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = "";

            const totalPages = Math.ceil(filteredItems.length / ITEMS_PER_PAGE);
            if (totalPages === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888;'>Pencarian tidak ditemukan.</p>";
                document.getElementById('pagination').style.display = "none";
                return;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const currentData = filteredItems.slice(startIndex, endIndex);

            currentData.forEach(item => {
                const imgUrl = URL.createObjectURL(item.imageFile);

                const div = document.createElement('div');
                div.className = "list-item";
                div.innerHTML = `
                    <div class="item-info">
                        <img src="${imgUrl}" class="item-img" alt="icon">
                        <span class="item-path">${item.path}</span>
                    </div>
                    <button class="btn-copy-small" onclick="copyPath('${item.path}')">📋 Copy</button>
                `;
                container.appendChild(div);
            });

            document.getElementById('pagination').style.display = "flex";
            document.getElementById('pageInfo').innerText = `Hal ${currentPage} / ${totalPages}`;
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredItems.length / ITEMS_PER_PAGE);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterList() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            filteredItems = allItems.filter(item => item.path.includes(query));
            currentPage = 1;
            renderList();
        }

        function copyPath(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert(`✅ Berhasil di-copy:\n${text}`);
            }).catch(() => {
                alert("Gagal copy otomatis, silakan blok teks manual.");
            });
        }

        function downloadTXT() {
            if (allItems.length === 0) return;
            
            let txtContent = "=== MINECRAFT ALL TEXTURE PATH LIST ===\n\n";
            allItems.forEach((item, index) => {
                txtContent += `${index + 1}. ${item.path}\n`;
            });

            const blob = new Blob([txtContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "Daftar_Semua_Texture_Addon.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
