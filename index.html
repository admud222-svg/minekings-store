<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Texture Scanner - Anti Freeze</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e1e; 
            color: #ffffff; 
            padding: 20px; 
            line-height: 1.6;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #2d2d2d; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }
        h1 { 
            text-align: center; 
            color: #4CAF50; 
            border-bottom: 2px solid #444;
            padding-bottom: 15px;
        }
        p { text-align: center; color: #aaaaaa; }
        .upload-area {
            border: 2px dashed #4CAF50;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background: #252525;
            margin-bottom: 20px;
        }
        input[type="file"] { 
            display: block; 
            width: 100%; 
            cursor: pointer;
            color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-copy { background: #2196F3; }
        .btn-copy:hover { background: #1976D2; }
        
        textarea { 
            width: 100%; 
            height: 400px; 
            background: #121212; 
            color: #00ff00; 
            border: 1px solid #444; 
            padding: 15px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px;
            border-radius: 6px; 
            resize: vertical; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Texture Scanner (Anti-Freeze)</h1>
        <p>Aman untuk ribuan file! Sistem mencicil proses agar browser tidak macet.</p>
        
        <div class="upload-area">
            <input type="file" id="folderInput" webkitdirectory directory multiple>
        </div>

        <div class="btn-group">
            <button id="scanBtn" onclick="scanFiles()">🔍 Mulai Scan Folder</button>
            <button class="btn-copy" onclick="copyText()">📋 Copy Hasil</button>
        </div>
        
        <textarea id="output" readonly placeholder="List path texture akan muncul di sini secara otomatis..."></textarea>
    </div>

    <script>
        async function scanFiles() {
            const files = document.getElementById('folderInput').files;
            if (files.length === 0) return alert("⚠️ Tolong pilih folder Resource Pack terlebih dahulu!");

            const output = document.getElementById('output');
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true; // Matikan tombol agar tidak di-spam klik
            
            let textureSet = new Set();
            let jsonFiles = [];

            // 1. Filter: Hanya ambil file JSON untuk mempercepat (Abaikan gambar png, audio, dll)
            for (let i = 0; i < files.length; i++) {
                if (files[i].name.endsWith('.json')) {
                    jsonFiles.push(files[i]);
                }
            }

            if (jsonFiles.length === 0) {
                output.value = "❌ Tidak ada file .json yang ditemukan di dalam folder tersebut!";
                scanBtn.disabled = false;
                return;
            }

            output.value = `⏳ Persiapan: Memulai scan pada ${jsonFiles.length} file JSON...\n(Mengabaikan ribuan file gambar/audio yang tidak perlu)`;

            let processed = 0;
            const batchSize = 50; // Sistem mencicil: Membaca 50 file per putaran

            // 2. Proses scanning dengan sistem cicil (anti-freeze)
            for (let i = 0; i < jsonFiles.length; i++) {
                const file = jsonFiles[i];
                try {
                    const text = await file.text();
                    // Regex mencari path texture
                    const matches = text.match(/textures\/(items|blocks)\/[a-zA-Z0-9_\-\/]+/g);
                    if (matches) {
                        matches.forEach(match => textureSet.add(match));
                    }
                } catch (e) {
                    console.error("Gagal membaca file: " + file.name);
                }

                processed++;
                
                // Beri jeda/nafas untuk browser setiap 50 file agar UI tidak macet
                if (processed % batchSize === 0 || processed === jsonFiles.length) {
                    output.value = `⏳ Sedang memproses... (${processed} dari ${jsonFiles.length} file JSON) \nDitemukan sementara: ${textureSet.size} texture path. \n\nMohon tunggu, browser sedang bekerja...`;
                    // Istirahat 5 milidetik untuk memberikan ruang pada RAM
                    await new Promise(resolve => setTimeout(resolve, 5));
                }
            }

            // 3. Menampilkan Hasil Akhir
            const sortedTextures = Array.from(textureSet).sort();
            let finalString = "";
            
            if (sortedTextures.length === 0) {
                finalString = "❌ Tidak ada texture path yang ditemukan! Pastikan ini benar-benar folder Resource Pack Addon.";
            } else {
                finalString = `✅ SCAN SUKSES! Total Ditemukan: ${sortedTextures.length} Texture Paths\n`;
                finalString += "=================================================\n\n";
                sortedTextures.forEach((path, index) => {
                    finalString += `${index + 1}. ${path}\n`;
                });
            }

            output.value = finalString;
            scanBtn.disabled = false; // Nyalakan tombol kembali
        }

        function copyText() {
            const output = document.getElementById('output');
            if(output.value === "" || output.value.includes("⏳")) {
                return alert("Tunggu proses scan selesai sebelum meng-copy!");
            }
            output.select();
            document.execCommand("copy");
            alert("✅ Hasil berhasil di-copy! Silakan paste ke obrolan AI kita.");
        }
    </script>
</body>
</html>
